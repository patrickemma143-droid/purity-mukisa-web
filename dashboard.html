<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Event Dashboard — Purity Mukisa Tickets</title>
<link rel="stylesheet" href="styles.css?v=3"/>
<style>
body{ background:var(--cream-dark); }
.dash{ max-width:760px; margin:0 auto; padding:30px 18px 70px; }
h1{ font-family:'Playfair Display',serif; color:var(--dark); text-align:center; font-size:26px; margin-bottom:4px; }
.sub{ text-align:center; color:var(--text-light); font-family:'Space Grotesk',sans-serif; font-size:12px; margin-bottom:22px; }
.gate{ display:flex; gap:8px; justify-content:center; margin-bottom:22px; }
.gate input{ padding:12px 14px; border:1px solid var(--cream-deep); border-radius:10px; font-size:15px; }
.ev-card{ background:var(--cream); border:1px solid var(--cream-deep); border-radius:var(--radius-lg); padding:22px; margin-bottom:18px; }
.ev-title{ font-family:'Playfair Display',serif; font-size:20px; font-weight:700; color:var(--dark); }
.ev-status{ font-family:'Space Grotesk',sans-serif; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--terra); }
.metrics{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:16px 0; }
.metric{ background:var(--cream-dark); border-radius:10px; padding:12px; text-align:center; }
.metric .n{ font-family:'Playfair Display',serif; font-size:24px; font-weight:800; color:var(--dark); line-height:1; }
.metric .l{ font-family:'Space Grotesk',sans-serif; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-light); margin-top:5px; }
.bar{ height:8px; background:var(--cream-deep); border-radius:6px; overflow:hidden; margin:4px 0 14px; }
.bar > span{ display:block; height:100%; background:var(--sage); }
.tier{ display:flex; justify-content:space-between; font-family:'Space Grotesk',sans-serif; font-size:13px; padding:7px 0; border-top:1px solid var(--cream-deep); color:var(--text-muted); }
@media(max-width:560px){ .metrics{ grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>
<div class="dash">
  <h1>🎟️ Event Dashboard</h1>
  <div class="sub" id="sub">Live tickets sold & checked-in · auto-refreshes</div>
  <div class="gate">
    <input id="pin" type="password" placeholder="Dashboard PIN"/>
    <button class="btn btn-primary btn-sm" id="go" type="button">View</button>
  </div>
  <div id="out"></div>
</div>
<script>
const SUPABASE_URL='https://facffdxpdzydudjaujpj.supabase.co';
const SUPABASE_KEY='sb_publishable_uwJ8zN20MVQSsVWyQRQ3Mw_YUsFDoLO';
const FN=SUPABASE_URL+'/functions/v1';
const out=document.getElementById('out'), sub=document.getElementById('sub'), pinEl=document.getElementById('pin');
pinEl.value=sessionStorage.getItem('dashPin')||'';
const fmt=n=>'UGX '+(Number(n)||0).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let timer=null;
async function load(){
  const pin=pinEl.value.trim(); if(!pin){ out.innerHTML='<p style="text-align:center;color:var(--text-light);">Enter the PIN to view.</p>'; return; }
  sessionStorage.setItem('dashPin',pin);
  try{
    const r=await fetch(FN+'/event-stats',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},body:JSON.stringify({pin})});
    const d=await r.json();
    if(r.status===401){ out.innerHTML='<p style="text-align:center;color:#b23b3b;">Wrong PIN.</p>'; return; }
    if(!r.ok){ out.innerHTML='<p style="text-align:center;color:#b23b3b;">'+esc(d.error||'Error')+'</p>'; return; }
    render(d.events||[]);
    sub.textContent='Updated '+new Date().toLocaleTimeString()+' · auto-refreshes every 15s';
    if(!timer) timer=setInterval(load,15000);
  }catch(e){ out.innerHTML='<p style="text-align:center;color:#b23b3b;">Network error.</p>'; }
}
function render(events){
  if(!events.length){ out.innerHTML='<p style="text-align:center;color:var(--text-light);">No events yet.</p>'; return; }
  out.innerHTML=events.map(e=>{
    const cap=e.capacity||0, sold=e.sold||0, cin=e.checked_in||0;
    const pct=cap?Math.min(100,Math.round(sold/cap*100)):0;
    const tiers=(e.tiers||[]).map(t=>`<div class="tier"><span>${esc(t.name)} · ${fmt(t.price)}</span><span>${t.sold}${t.capacity?(' / '+t.capacity):''} sold</span></div>`).join('');
    return `<div class="ev-card">
      <div class="ev-status">${esc(e.status)}</div>
      <div class="ev-title">${esc(e.event)}</div>
      <div class="metrics">
        <div class="metric"><div class="n">${sold}</div><div class="l">Sold</div></div>
        <div class="metric"><div class="n">${cin}</div><div class="l">Checked in</div></div>
        <div class="metric"><div class="n">${cap?Math.max(cap-sold,0):'∞'}</div><div class="l">Remaining</div></div>
        <div class="metric"><div class="n" style="font-size:17px;">${fmt(e.revenue_ugx)}</div><div class="l">Revenue</div></div>
      </div>
      ${cap?`<div class="bar"><span style="width:${pct}%"></span></div>`:''}
      ${tiers}
    </div>`;
  }).join('');
}
document.getElementById('go').addEventListener('click',load);
pinEl.addEventListener('keydown',e=>{ if(e.key==='Enter') load(); });
if(pinEl.value) load();
</script>
</body>
</html>
